    <nav class="pages">

    <h1>how to run</h1>
    <pre class="report">npm run serve
# 打开 http://localhost:5173/test/index.html</pre>

    <p class="hint">
        注意：必须通过 HTTP 打开。直接 file:// 打开会因为 ES module 的同源策略与视频 Range 请求而失败。
