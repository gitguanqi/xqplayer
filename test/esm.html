<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xqplayer · ESM 自检</title>
    <link rel="stylesheet" href="../lib/css/xqplayer.min.css">
    <link rel="stylesheet" href="demo/demo.css">
</head>

<body>
    <h1>ESM 引入自检</h1>
    <p class="lead">
        用 &lt;script type="module"&gt; 加载 lib/js/xqplayer-esm.min.mjs，
        验证 default 与具名导出都可用，并且和 UMD 是同一份实现。
    </p>

    <nav class="pages">
        <a href="index.html">返回导航</a>
        <a href="browser.html">UMD</a>
        <a href="vue2.html">Vue 2</a>
        <a href="vue3.html">Vue 3</a>
    </nav>

    <div class="player-host" id="playerA"></div>
    <div class="player-host" id="probeHost"></div>
    <div class="report" data-xq-report></div>

    <script src="demo/check.js"></script>
    <script src="demo/load-xqshare.js"></script>
    <script type="module">
        import XQVideoPlayer, { XQVideoPlayer as Named, VERSION } from '../lib/js/xqplayer-esm.min.mjs';

        XQCheck.assert('default 与具名导出指向同一个构造函数', function () {
            if (XQVideoPlayer !== Named) throw new Error('不一致');
        });
        XQCheck.assert('VERSION 已导出', function () {
            if (typeof VERSION !== 'string') throw new Error('缺少 VERSION');
        });
        XQCheck.equal('静态 version 与 VERSION 一致', XQVideoPlayer.version, VERSION);
        XQCheck.assert('isSupportedMode 可用', function () {
            if (XQVideoPlayer.isSupportedMode('mp4') !== true) throw new Error('mp4 应受支持');
            if (XQVideoPlayer.isSupportedMode('wmv') !== false) throw new Error('wmv 不应受支持');
        });

        var player = new XQVideoPlayer({
            el: '#playerA',
            url: './data/movie.mp4',
            poster: './data/poster.jpg',
            barrages: [{ id: 1, avatar: '', name: '测试1', content: '来自 ESM' }],
            mode: 'mp4',
            width: 720,
            height: 405,
        });

        XQCheck.assert('挂载成功', function () {
            if (!player.root) throw new Error('缺少根节点');
        });
        XQCheck.equal('refs 里的 video 就是自己的 video', player.q('video'), player.refs.video);
        XQCheck.assert('缺少 Hls 时不崩（m3u8 降级为错误态）', function () {
            var probe = new XQVideoPlayer({
                el: '#probeHost',
                url: './data/missing.m3u8',
                mode: 'm3u8',
                width: 320,
                height: 180,
            });
            // 走到这里说明构造没抛 ReferenceError
            probe.destroy();
        });

        // destroy 验证改用一次性实例，player 保留在页面上展示完整效果
        var disposable = new XQVideoPlayer({
            el: '#probeHost',
            url: './data/movie.mp4',
            mode: 'mp4',
            width: 480,
            height: 270,
        });
        disposable.destroy();
        XQCheck.assert('destroy 后容器被清空', function () {
            if (document.querySelector('#probeHost .xqvideo-box')) throw new Error('DOM 仍在');
        });
        XQCheck.assert('destroy 后主实例依旧可用', function () {
            if (!player.root) throw new Error('player 被误伤');
        });

        XQCheck.after('分享组件可用', XqLoadShare(), function () {
            if (!window.XqShare) throw new Error(window.__xqShareError || '未取到 XqShare');
        });
        XQCheck.after('点击分享能弹出弹层', XqLoadShare(), function () {
            var widget = player.shareVideo();
            if (!widget) throw new Error('没有创建出分享实例');
            if (!document.querySelector('#playerA .xqshare')) throw new Error('弹层没渲染出来');
            widget.hide();
        });
    </script>
</body>

</html>
